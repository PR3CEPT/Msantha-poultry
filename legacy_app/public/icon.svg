<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="combGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>
  <!-- Background with subtle corner radius -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer decorative ring for agrarian harmony -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#2d6a4f" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Sun / Egg Golden Aura -->
  <circle cx="256" cy="230" r="140" fill="url(#goldGrad)" opacity="0.18" />

  <!-- Stylized Rooster / Hen Head & Egg Silhouette -->
  <!-- Egg Base representing Production & Incubation -->
  <path d="M 256 120 C 190 120 150 190 150 280 C 150 355 195 400 256 400 C 317 400 362 355 362 280 C 362 190 322 120 256 120 Z" fill="#ffffff" fill-opacity="0.95" />

  <!-- Rooster Silhouette & Crown inside Egg -->
  <!-- Comb -->
  <path d="M 230 150 C 230 135 242 130 250 140 C 258 128 274 130 278 142 C 288 132 298 140 294 156 Z" fill="url(#combGrad)" />
  
  <!-- Beak -->
  <polygon points="296,182 324,196 296,206" fill="#f59e0b" />
  
  <!-- Wattle -->
  <path d="M 284 204 C 294 208 296 226 288 230 C 280 234 276 218 284 204 Z" fill="url(#combGrad)" />

  <!-- Hen / Rooster Head Profile in Dark Emerald -->
  <path d="M 250 155 C 274 155 296 170 296 195 C 296 212 280 220 280 235 C 280 255 310 270 325 310 C 330 325 320 345 300 355 C 280 365 240 365 220 350 C 200 335 195 300 205 270 C 215 240 230 215 230 190 C 230 170 240 155 250 155 Z" fill="#1b4332" />

  <!-- Eye -->
  <circle cx="272" cy="184" r="5" fill="#fbbf24" />
  <circle cx="273" cy="183" r="2" fill="#0f172a" />

  <!-- Sprout / Wheat Leaves at bottom representing agriculture & Liwonde -->
  <path d="M 220 380 C 200 360 170 370 160 395 C 185 395 210 390 220 380 Z" fill="#52b788" />
  <path d="M 292 380 C 312 360 342 370 352 395 C 327 395 302 390 292 380 Z" fill="#52b788" />
  <circle cx="256" cy="386" r="6" fill="#fbbf24" />

  <!-- Subtitle Text Ring -->
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#d8f3dc" letter-spacing="3">MSANTHA FARM</text>
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#74c69d" letter-spacing="4">LIWONDE • MALAWI</text>
</svg>
